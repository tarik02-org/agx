# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: agx

before:
  hooks:
    - rm -rf completions manpages
    - mkdir completions manpages
    - sh -c 'go run ./cmd/agx completion bash >completions/agx.bash'
    - sh -c 'go run ./cmd/agx completion fish >completions/agx.fish'
    - sh -c 'go run ./cmd/agx completion zsh >completions/_agx'
    - sh -c 'go run ./cmd/agx completion powershell >completions/agx.ps1'
    - sh -c 'go run ./cmd/agx man | gzip -9 >manpages/agx.1.gz'
    # The binaries embed the web UI.
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build

builds:
  - id: agx
    main: ./cmd/agx
    binary: agx
    env:
      # go-keyring shells out to security(1) on macOS and needs no cgo elsewhere either.
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/tarik02-org/agx/internal/daemon.Version={{ .Version }}

archives:
  - id: agx
    ids: [agx]
    # A nightly's version lives in its release title; its archives are named agx_nightly_*.
    name_template: >-
      {{ .ProjectName }}_{{ if .IsSnapshot }}nightly{{ else }}{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      # The README's links and quick start rely on these.
      - docs/*.md
      - examples/*
      - completions/*
      - manpages/*

checksum:
  name_template: checksums.txt

snapshot:
  # The nightly job computes <last release>+nightly.<commits since>.<short sha>.
  version_template: '{{ envOrDefault "NIGHTLY_VERSION" (printf "%s-snapshot" .ShortCommit) }}'

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge '

release:
  github:
    owner: tarik02-org
    name: agx
  prerelease: auto
