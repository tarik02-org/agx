syntax = "proto3";

package agx.v1;

option go_package = "github.com/tarik02-org/agx/gen/agx/v1;agxv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Control interface. Native MCP traffic uses separate HTTP endpoints.
service ConfigurationService {
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // The configuration as loaded, for browsing it: harnesses, scope directories, and files.
  rpc GetConfiguration(GetConfigurationRequest) returns (GetConfigurationResponse);
  // Directories whose path starts with a prefix, for directory pickers.
  rpc CompleteDirectory(CompleteDirectoryRequest) returns (CompleteDirectoryResponse);
  // Every definition as configured, with the YAML that defines it.
  rpc ListDefinitions(ListDefinitionsRequest) returns (ListDefinitionsResponse);
  // A skill's files, for browsing and editing a local one.
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse);
  // One file of a configured skill or instructions definition, or of a configuration fragment.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // Validates a set of changes against the configuration they would produce and returns their
  // diff; writes nothing.
  rpc PlanChanges(PlanChangesRequest) returns (PlanChangesResponse);
  // Writes a planned set of changes atomically, when no file changed since the plan.
  rpc ApplyChanges(ApplyChangesRequest) returns (ApplyChangesResponse);
}

service PackageService {
  // Installs the configuration's packages, streaming progress and then the result or failure.
  rpc Install(InstallRequest) returns (stream InstallResponse);
  // Fetches a Git source into the cache and lists the skills it holds, without changing the
  // configuration; previews expire after 30 minutes.
  rpc PreviewSource(PreviewSourceRequest) returns (PreviewSourceResponse);
  // One file of a previewed skill.
  rpc ReadPreviewFile(ReadPreviewFileRequest) returns (ReadPreviewFileResponse);
  // A Git source's branches and tags, without fetching it.
  rpc ListSourceRefs(ListSourceRefsRequest) returns (ListSourceRefsResponse);
  // Checks a Git source out at a ref or revision without configuring it: the commit it resolves
  // to, the content hash a package pinned to it records, and its directories.
  rpc InspectSource(InspectSourceRequest) returns (InspectSourceResponse);
}

service LaunchService {
  rpc PrepareLaunch(PrepareLaunchRequest) returns (PrepareLaunchResponse);
  rpc RenewLaunch(RenewLaunchRequest) returns (RenewLaunchResponse);
  rpc FinishLaunch(FinishLaunchRequest) returns (FinishLaunchResponse);
  rpc RevokeLaunch(RevokeLaunchRequest) returns (RevokeLaunchResponse);
  // Resolves a directory for one thread of a launch whose harness process serves many threads.
  rpc ResolveThread(ResolveThreadRequest) returns (ResolveThreadResponse);
  // Prepares the resources of one such thread as a launch under the process's launch. It shares
  // the parent's lease and lifecycle token and ends with it.
  rpc PrepareThreadLaunch(PrepareThreadLaunchRequest) returns (PrepareThreadLaunchResponse);
  // Hands a daemon that does not hold a launch, or let it expire, everything its wrapper keeps,
  // so the launch serves again under its ID and grant: after a restart, an upgrade, or a crash.
  // Attaching a launch the daemon holds changes nothing; a revoked launch cannot come back.
  rpc AttachLaunch(AttachLaunchRequest) returns (AttachLaunchResponse);
}

service RuntimeService {
  rpc GetRuntime(GetRuntimeRequest) returns (GetRuntimeResponse);
  rpc WatchRuntime(WatchRuntimeRequest) returns (stream WatchRuntimeResponse);
  // Connects to one MCP server outside any launch and lists its tools.
  rpc TestMcpServer(TestMcpServerRequest) returns (TestMcpServerResponse);
  // Lists the tools of the MCP servers in a call scope. Takes a launch grant for a launch's
  // scope, or management authorization.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  // Calls one tool of an MCP server in a call scope. Credentials and tool execution stay in the
  // daemon; the caller receives only the result. Authorized like ListTools.
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
  // Lists the running stdio MCP server processes: shared ones, including idle ones still
  // warm, and those of single sessions.
  rpc ListMcpProcesses(ListMcpProcessesRequest) returns (ListMcpProcessesResponse);
  // Stops one stdio MCP server process. Its sessions end, so harnesses reconnect and the next
  // session starts it again; a shared process stops for every launch using it.
  rpc StopMcpProcess(StopMcpProcessRequest) returns (StopMcpProcessResponse);
  // Stops the daemon. Without force, wrappers attach their active launches to the next daemon;
  // force revokes their MCP access.
  rpc Stop(StopRequest) returns (StopResponse);
}

service SecretService {
  // Starts an OAuth login, or joins the one pending for the secret, and reports it until it
  // finishes. Ending the stream early withdraws this caller; the attempt is cancelled once no
  // caller waits for it.
  rpc Login(LoginRequest) returns (stream LoginResponse);
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc GetSecretStatus(GetSecretStatusRequest) returns (GetSecretStatusResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Renews an OAuth secret's access token with its refresh token now, whether or not it
  // expired. A missing login, or a refresh token the authorization server refuses, fails with
  // REASON_NEEDS_LOGIN; an authorization server that cannot be reached or fails with
  // REASON_NETWORK.
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse);
}

message ResourceRef {
  oneof resource {
    string skill_id = 1;
    string instructions_id = 2;
    string mcp_id = 3;
  }
}

message SourceLocation {
  string path = 1;
  uint32 line = 2;
  uint32 column = 3;
}

message Diagnostic {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_WARNING = 1;
    SEVERITY_ERROR = 2;
  }
  Severity severity = 1;
  string code = 2;
  string summary = 3;
  SourceLocation source = 4;
}

// Detail every daemon error carries, so clients branch on a closed set of reasons instead of the
// Connect code or the message. A client treats a reason it does not know as unclassified.
message ErrorDetail {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The request is malformed or names something it may not.
    REASON_INVALID_REQUEST = 1;
    REASON_NOT_FOUND = 2;
    // The target exists, changed, or is busy; retrying later or resolving again may succeed.
    REASON_CONFLICT = 3;
    // The target does not support the operation in its current state.
    REASON_FAILED_PRECONDITION = 4;
    // The operation needs an OAuth login first.
    REASON_NEEDS_LOGIN = 5;
    // The daemon's configuration does not load.
    REASON_CONFIG_INVALID = 6;
    // The daemon is stopping or cannot serve the request yet.
    REASON_UNAVAILABLE = 7;
    // The caller lacks this daemon's credential, as when another daemon replaced the one it knew.
    REASON_UNAUTHENTICATED = 8;
    // The daemon or an upstream did not answer in time.
    REASON_TIMEOUT = 9;
    // A defect.
    REASON_INTERNAL = 10;
    // An MCP server failed the request, or could not be reached or started.
    REASON_MCP_FAILED = 11;
    // A service the daemon depends on, such as an OAuth authorization server, could not be
    // reached or failed; retrying later may succeed.
    REASON_NETWORK = 12;
    // Configuration changes could go to several fragments; the request must name one.
    REASON_CHOOSE_FILE = 13;
  }
  Reason reason = 1;
  // Where a configuration that does not load has the problem, when known.
  SourceLocation source = 2;
  // With REASON_CHOOSE_FILE, the writable fragments to choose from.
  repeated string files = 3;
}

message Snapshot {
  string id = 1;
  string directory = 2;
  repeated ResourceRef resources = 3;
  repeated string required_environment = 4;
  // Empty when resolved without a harness.
  string harness = 5;
}

message ResolutionStep {
  enum Change {
    CHANGE_UNSPECIFIED = 0;
    CHANGE_ADD = 1;
    CHANGE_REMOVE = 2;
  }
  Change change = 1;
  SourceLocation source = 2;
  string scope_directory = 3;
  repeated string bundle_chain = 4;
  // Harness whose own add/remove produced the step; empty for directory scopes.
  string harness = 5;
}

message ResourceTrace {
  ResourceRef resource = 1;
  repeated ResolutionStep steps = 2;
}

message ValidateRequest {}
message ValidateResponse {
  repeated Diagnostic diagnostics = 1;
}

message ResolveRequest {
  string directory = 1;
  // Built-in or defined harness name; empty applies only harness-independent rules.
  string harness = 2;
}
message ResolveResponse {
  Snapshot snapshot = 1;
  repeated ResourceTrace traces = 2;
  repeated Diagnostic diagnostics = 3;
  // The resolved native settings of the harness, one per leaf; empty without a harness.
  repeated HarnessSetting settings = 4;
}
message HarnessSetting {
  repeated string path = 1;
  // The value as JSON.
  string value_json = 2;
  SourceLocation source = 3;
}

message GetConfigurationRequest {}
message GetConfigurationResponse {
  string root = 1;
  repeated ConfiguredHarness harnesses = 2;
  // Directories scope rules name, sorted, without duplicates.
  repeated string scope_directories = 3;
  repeated ConfigurationFile files = 4;
  // The daemon user's home directory, for showing paths as ~/….
  string home = 5;
}
message ConfiguredHarness {
  string name = 1;
  string builtin = 2;
  // Empty for built-in harnesses.
  string base = 3;
  bool hidden = 4;
}
message ConfigurationFile {
  string path = 1;
  // A symlink, such as one Nix or Home Manager links from /nix/store, or a file agx cannot write.
  bool read_only = 2;
  // Where a symlink points; empty otherwise.
  string link_target = 3;
}

message CompleteDirectoryRequest {
  // An absolute path or one starting with ~/; the last segment is a name prefix.
  string prefix = 1;
  // Also lists files, for picking one.
  bool files = 2;
}
message CompleteDirectoryResponse {
  // At most 50 absolute directories, sorted.
  repeated string directories = 1;
  // With files set, at most 50 absolute files besides the directories, sorted.
  repeated string files = 2;
}

message InstallRequest {
  bool frozen = 1;
}
message InstallResponse {
  oneof state {
    PackageProgress progress = 1;
    PackageResult result = 2;
    Diagnostic failure = 3;
  }
}
message PackageProgress {
  string package_id = 1;
  uint32 completed = 2;
  uint32 total = 3;
}
message PackageResult {
  repeated string package_ids = 1;
  repeated string lockfiles = 2;
}

message PrepareLaunchRequest {
  string snapshot_id = 1;
  string directory = 2;
  // Built-in or defined harness name. The daemon resolves its definition.
  string harness = 3;
  // Sensitive: native arguments may contain prompt bodies or credentials.
  repeated string native_arguments = 4;
  // Sensitive: only names declared by the expected snapshot are accepted, and the variables
  // the harness's adapter forwards, such as CODEX_HOME; an empty value means unset.
  map<string, string> environment_inputs = 5;
  // Absolute path of the native executable the wrapper found on its own PATH, or the configured
  // one. The wrapper runs it; the daemon runs it only for native installation on its behalf.
  string executable = 6;
}
message PrepareLaunchResponse {
  Launch launch = 1;
  SpawnPlan spawn = 2;
  // Sensitive: wrapper-only credential; never inherited by the harness.
  string lifecycle_token = 3;
  uint32 renew_after_seconds = 4;
  // Problems the launch proceeds despite, such as skills the harness cannot load.
  repeated string warnings = 5;
}
// The wrapper runs the native executable it resolved itself, so per-directory PATHs apply.
message SpawnPlan {
  repeated string arguments = 1;
  string directory = 2;
  // Sensitive: includes the stable harness MCP grant for this lease.
  map<string, string> environment_overrides = 3;
  repeated string unset_environment = 4;
  // Prepended to the appendSystemPrompt of the first initialize request the harness reads from
  // stream-json standard input, which replaces the flag-given append. Empty leaves input untouched.
  string initialize_system_prompt = 5;
}

message Launch {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_PREPARED = 1;
    STATE_RUNNING = 2;
    STATE_FINISHED = 3;
    STATE_REVOKED = 4;
    STATE_EXPIRED = 5;
  }
  string id = 1;
  string snapshot_id = 2;
  string directory = 3;
  string harness = 4;
  State state = 5;
  google.protobuf.Timestamp expires_at = 6;
  // Invocation mode classified from the native arguments, such as interactive or exec.
  string mode = 7;
  // Set for a thread launch: the launch of the harness process serving the thread.
  string parent_launch_id = 8;
  // Native session the launch serves, once the wrapper reports it; a thread launch's thread.
  string session_id = 9;
}

message ResolveThreadRequest {
  string parent_launch_id = 1;
  string directory = 2;
}
message ResolveThreadResponse {
  Snapshot snapshot = 1;
  // Native plugin IDs a thread in the directory keeps disabled.
  repeated string disabled_plugins = 2;
}

message PrepareThreadLaunchRequest {
  string parent_launch_id = 1;
  string snapshot_id = 2;
  string directory = 3;
  // Sensitive: only names declared by the expected snapshot are accepted.
  map<string, string> environment_inputs = 4;
}
message PrepareThreadLaunchResponse {
  Launch launch = 1;
  ThreadPlan thread = 2;
  // Problems the thread proceeds despite, such as skills the harness cannot load.
  repeated string warnings = 3;
  // Sensitive: the thread's MCP grant, which config_json also carries, for AttachLaunch.
  string grant = 4;
}
// What the wrapper adds to a thread's native requests.
message ThreadPlan {
  // Sensitive: native configuration overrides as a JSON object, including the thread's MCP grant.
  string config_json = 1;
  string instructions = 2;
  // Native plugin IDs the thread keeps disabled.
  repeated string disabled_plugins = 3;
}

// Renew/finish use lifecycle authorization metadata, not management/MCP grants.
message RenewLaunchRequest {
  string launch_id = 1;
  uint64 harness_pid = 2;
  // Native session the launch serves, once known; renewing a thread launch with it marks the
  // thread running. Thread launches otherwise follow their parent's lease.
  string session_id = 3;
}
message RenewLaunchResponse {
  google.protobuf.Timestamp expires_at = 1;
}

// Uses management authorization; the lifecycle token proves the caller is the launch's wrapper.
message AttachLaunchRequest {
  // The launch as PrepareLaunch returned it.
  Launch launch = 1;
  // Sensitive: the launch's MCP grant, which its harness keeps using.
  string grant = 2;
  // Sensitive: the launch's lifecycle token.
  string lifecycle_token = 3;
  // Sensitive: the environment inputs the launch was prepared with.
  map<string, string> environment_inputs = 4;
  // Sensitive: the native arguments the launch was prepared with.
  repeated string native_arguments = 5;
  // The native executable the launch was prepared with.
  string executable = 6;
  // For a process serving threads, its active thread launches.
  repeated AttachedThread threads = 7;
}
message AttachedThread {
  // The thread launch as PrepareThreadLaunch returned it, with the thread it serves once bound.
  Launch launch = 1;
  // Sensitive: the thread launch's MCP grant.
  string grant = 2;
  // Sensitive: the environment inputs the thread launch was prepared with.
  map<string, string> environment_inputs = 3;
}
message AttachLaunchResponse {
  google.protobuf.Timestamp expires_at = 1;
}

message FinishLaunchRequest {
  string launch_id = 1;
  oneof outcome {
    int32 exit_code = 2;
    string signal_name = 3;
    string spawn_failure = 4;
    // The harness closed the thread a thread launch served.
    bool thread_closed = 5;
  }
}
message FinishLaunchResponse {}

message RevokeLaunchRequest {
  string launch_id = 1;
}
message RevokeLaunchResponse {}

message McpRuntime {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_CONNECTING = 1;
    STATE_READY = 2;
    STATE_NEEDS_AUTH = 3;
    STATE_FAILED = 4;
  }
  string launch_id = 1;
  string mcp_id = 2;
  State state = 3;
  repeated Diagnostic diagnostics = 4;
}

message RuntimeView {
  string daemon_instance_id = 1;
  string version = 2;
  repeated Launch launches = 3;
  repeated McpRuntime mcp_servers = 4;
  repeated Diagnostic diagnostics = 5;
}

message GetRuntimeRequest {}
message GetRuntimeResponse {
  RuntimeView runtime = 1;
}
message WatchRuntimeRequest {}
message WatchRuntimeResponse {
  RuntimeView runtime = 1;
}
message TestMcpServerRequest {
  string mcp_id = 1;
  // Directory a stdio server without cwd runs in.
  string directory = 2;
  // Sensitive: only names the server's injected values need are accepted.
  map<string, string> environment_inputs = 3;
}
message TestMcpServerResponse {
  string server_name = 1;
  string server_version = 2;
  // Names of the tools the server lists.
  repeated string tools = 3;
  // The tools the server lists, in its order, with their descriptions.
  repeated Tool tool_details = 4;

  message Tool {
    string name = 1;
    string description = 2;
  }
}

// The MCP servers a ListTools or CallTool caller reaches. With launch_id, the request carries
// that launch's grant, or management authorization, and reaches the servers of the launch's
// snapshot through its endpoints, native and on-demand alike. Without it, the request carries
// management authorization and reaches the servers selected for directory, or every configured
// server with all.
message McpCallScope {
  string launch_id = 1;
  // Absolute directory whose scopes select the servers, and where a stdio server without cwd
  // runs; required without launch_id.
  string directory = 2;
  bool all = 3;
  // Sensitive: only names the reached servers' values read are accepted; ignored for a launch,
  // which has its own.
  map<string, string> environment_inputs = 4;
}

message ListMcpProcessesRequest {
  // Only processes whose working directory is this absolute directory; empty for any.
  string cwd = 1;
  // Only processes working in this absolute directory or below it; empty for any.
  string under = 2;
}
message ListMcpProcessesResponse {
  // Ordered by directory, then server, then process ID.
  repeated McpProcess processes = 1;
}
message McpProcess {
  string mcp_id = 1;
  int64 pid = 2;
  // The process's working directory.
  string directory = 3;
  // none, directory, repo, or global.
  string share = 4;
  // The launch directory or repository root a shared process is keyed on; empty otherwise.
  string root = 5;
  // Launches whose sessions use it; empty for agx mcp call sessions outside a launch and for
  // an idle shared process.
  repeated string launch_ids = 6;
  // Harness and agx mcp call sessions using it.
  int32 sessions = 7;
  google.protobuf.Timestamp started_at = 8;
  // When an idle shared process stops; unset while sessions use it.
  google.protobuf.Timestamp stops_at = 9;
}
message StopMcpProcessRequest {
  int64 pid = 1;
}
message StopMcpProcessResponse {}

message StopRequest {
  bool force = 1;
  // How long requests in flight may finish; unset for the daemon's default.
  google.protobuf.Duration grace = 2;
}
message StopResponse {
  // Active launches whose wrappers attach them to the next daemon.
  uint32 kept_launches = 1;
}

message ListToolsRequest {
  McpCallScope scope = 1;
  // One server, whose failure fails the request; empty lists every server in scope, each with
  // its state.
  string mcp_id = 2;
}
message ListToolsResponse {
  repeated McpTools servers = 1;
}
message McpTools {
  enum Load {
    LOAD_UNSPECIFIED = 0;
    LOAD_NATIVE = 1;
    LOAD_ON_DEMAND = 2;
  }
  string mcp_id = 1;
  string description = 2;
  Load load = 3;
  // READY, NEEDS_AUTH, or FAILED.
  McpRuntime.State state = 4;
  // Why the server is not ready; never contains values.
  string message = 5;
  string server_name = 6;
  string server_version = 7;
  repeated McpTool tools = 8;
  // The icon the server declares, as a data URI; empty when it declares none.
  string icon = 9;
}
message McpTool {
  string name = 1;
  string title = 2;
  string description = 3;
  // JSON Schema of the arguments object.
  string input_schema_json = 4;
  // JSON Schema of the structured result; empty when the tool declares none.
  string output_schema_json = 5;
}

message CallToolRequest {
  McpCallScope scope = 1;
  string mcp_id = 2;
  string tool = 3;
  // Sensitive: the arguments as a JSON object; empty for none.
  string arguments_json = 4;
}
message CallToolResponse {
  // The tool reported an error; content describes it.
  bool is_error = 1;
  // The result's content as a JSON array of MCP content items; binary data is base64.
  string content_json = 2;
  // The result's structured content as JSON; empty when the tool returned none.
  string structured_content_json = 3;
}

message LoginRequest {
  // A top-level OAuth secret, or the ID of an MCP server whose auth is inline or implicit.
  string secret_id = 1;
}
message LoginResponse {
  oneof event {
    LoginStarted started = 1;
    LoginFinished finished = 2;
  }
}
// The first event: open authorization_url in a browser on this machine before expires_at.
message LoginStarted {
  string authorization_url = 1;
  google.protobuf.Timestamp expires_at = 2;
  // The MCP server whose URL the login authorizes.
  string mcp_id = 3;
}
// The last event; the stream then ends.
message LoginFinished {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_SUCCEEDED = 1;
    OUTCOME_FAILED = 2;
    OUTCOME_EXPIRED = 3;
  }
  Outcome outcome = 1;
  // Redacted reason for a failure.
  string message = 2;
}

message SetSecretRequest {
  string secret_id = 1;
  // Sensitive: credential value; must not enter RPC logs or telemetry.
  bytes value = 2;
}
message SetSecretResponse {}

message GetSecretStatusRequest {
  // Empty selects all configured secrets, except on-demand OAuth no server has asked for yet.
  string secret_id = 1;
}
message GetSecretStatusResponse {
  repeated SecretStatus statuses = 1;
}
message SecretStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_UNCONFIGURED = 1;
    STATE_PENDING = 2;
    STATE_READY = 3;
    STATE_NEEDS_LOGIN = 4;
    STATE_UNAVAILABLE = 5;
  }
  string secret_id = 1;
  State state = 2;
  google.protobuf.Timestamp expires_at = 3;
  repeated Diagnostic diagnostics = 4;
  // command, keychain, oauth, or sops.
  string kind = 5;
  // Set for a secret declared inline in this MCP server's auth; equal to secret_id.
  string mcp_id = 6;
  // OAuth an HTTP MCP server without auth uses once the server asks for it.
  bool on_demand = 7;
  // An OAuth login with a refresh token: an access token past expires_at is renewed when it is
  // next used.
  bool refreshable = 8;
}

message LogoutRequest {
  string secret_id = 1;
}
message LogoutResponse {}

message RotateSecretRequest {
  string secret_id = 1;
}
message RotateSecretResponse {
  // When the new access token expires; unset when the authorization server did not say.
  google.protobuf.Timestamp expires_at = 1;
}

// A definition kind is a configuration section: skills, instructions, mcp, secrets, bundles,
// packages, or harnesses.
message Definition {
  string kind = 1;
  string id = 2;
  SourceLocation source = 3;
  // The definition's value as written in its file; empty for one a package defines.
  string yaml = 4;
  // The package that defines it; empty for configuration fragments.
  string package = 5;
  // Its file is a symlink or not writable, or a package defines it.
  bool read_only = 6;
  // What it offers: a skill's or MCP server's description.
  string description = 7;
  // A skill's directory, or an instructions definition's file; empty otherwise.
  string path = 8;
  // A #rrggbb color for the definition's icon: the brand color a skill's agents/openai.yaml
  // declares for its interface; empty when there is none.
  string color = 9;
  // An image for the definition's icon, as a data URI: the icon_small a skill's
  // agents/openai.yaml names, or the icon an MCP server declared when it last started.
  string icon = 10;
}
message ListDefinitionsRequest {}
message ListDefinitionsResponse {
  repeated Definition definitions = 1;
}

message GetSkillRequest {
  string skill_id = 1;
}
message GetSkillResponse {
  Definition definition = 1;
  // SKILL.md as written.
  string skill_md = 2;
  // Files below the skill's directory, relative and /-separated, sorted.
  repeated string files = 3;
}

message ReadFileRequest {
  // A configuration fragment, or a file of a configured skill or instructions definition.
  string path = 1;
}
message ReadFileResponse {
  string path = 1;
  string content = 2;
  // A file larger than 1 MiB or not UTF-8 text is not returned.
  bool binary = 3;
  bool read_only = 4;
}

// One change the editor stages; PlanChanges and ApplyChanges take them in order.
message ConfigChange {
  oneof change {
    DefineChange define = 1;
    UndefineChange undefine = 2;
    SelectionChange enable = 3;
    SelectionChange disable = 4;
    FileWrite write_file = 5;
    PackageSource add_package = 6;
  }
}
// Creates or replaces a definition with the given YAML value, in the file that defines it now,
// or in the request's target fragment for a new one.
message DefineChange {
  reserved 4;
  reserved "file";
  string kind = 1;
  string id = 2;
  string yaml = 3;
}
// Removes a definition and every reference to it.
message UndefineChange {
  string kind = 1;
  string id = 2;
}
// Selects or deselects a skill, instructions definition, MCP server, or bundle for a directory
// (empty: everywhere) and harnesses (empty: all), as agx use and unuse do.
message SelectionChange {
  string kind = 1;
  string id = 2;
  string directory = 3;
  repeated string harnesses = 4;
}
// Replaces a file of a local skill or instructions definition.
message FileWrite {
  string path = 1;
  string content = 2;
}
// Declares a Git package, installs it into the cache, and locks it.
message PackageSource {
  string id = 1;
  string git = 2;
  string ref = 3;
  string subdir = 4;
}

message PlanChangesRequest {
  repeated ConfigChange changes = 1;
  // The fragment new definitions, rules, and packages go to: a writable fragment the root
  // lists, or a new file its globs match. Empty chooses the only writable fragment, or
  // agx.d/main.yaml when there is none; with several, the plan fails with
  // REASON_CHOOSE_FILE listing them in ErrorDetail.files.
  string file = 2;
}
message PlannedFile {
  string path = 1;
  // A unified diff from the file's current content.
  string diff = 2;
  // SHA-256 of the current content, hex; empty for a new file.
  string before_sha256 = 3;
}
message PlanChangesResponse {
  repeated PlannedFile files = 1;
}
message ApplyChangesRequest {
  repeated ConfigChange changes = 1;
  // The files of the plan with the hashes it saw; a file that changed since fails the apply.
  repeated PlannedFile expected = 2;
  // The target fragment the plan was made with.
  string file = 3;
}
message ApplyChangesResponse {
  repeated string written = 1;
}

message ListSourceRefsRequest {
  // A Git URL or local repository, as a package's git field names it.
  string git = 1;
}
message ListSourceRefsResponse {
  // The default branch first, then the other branches by name, then tags, newest version first.
  repeated SourceRef refs = 1;
}
message SourceRef {
  // The name a ref field takes, such as main or v1.2.0.
  string name = 1;
  bool tag = 2;
  // The commit it points to; an annotated tag's is the commit it tags.
  string commit = 3;
  // The branch the repository's HEAD names.
  bool default = 4;
}

message InspectSourceRequest {
  // A Git URL or local repository, as a package's git field names it.
  string git = 1;
  // Empty checks out the default branch; a full commit hash checks out that commit.
  string ref = 2;
  // The directory whose content is hashed; empty for the whole source.
  string subdir = 3;
}
message InspectSourceResponse {
  // The commit the ref or revision resolves to.
  string revision = 1;
  // The content hash of the subdirectory, as a package's hash field takes it.
  string hash = 2;
  // The source's directories, relative and /-separated, sorted, without Git metadata.
  repeated string directories = 3;
}

message PreviewSourceRequest {
  // owner/repo[@ref][/path], or a Git URL.
  string source = 1;
}
message PreviewSourceResponse {
  string preview_id = 1;
  // The package the source would be declared as, and its parsed source.
  PackageSource package = 2;
  repeated PreviewSkill skills = 3;
}
message PreviewSkill {
  // The skill's name within the package; its ID once added is <package>/<name>.
  string name = 1;
  string description = 2;
  string skill_md = 3;
  repeated string files = 4;
}
message ReadPreviewFileRequest {
  string preview_id = 1;
  string skill = 2;
  // Relative to the skill's directory, /-separated.
  string path = 3;
}
message ReadPreviewFileResponse {
  string content = 1;
  // A file larger than 1 MiB or not UTF-8 text is not returned.
  bool binary = 2;
}
